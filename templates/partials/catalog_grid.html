<div class="section-heading"><h2>{{ title }}</h2></div>
<div class="content-grid">{% for item in items %}<article class="content-card"><div class="poster poster-{{ item.art }}"><span class="poster-brand">NEX<span>LIX</span></span><button class="play-button">▶</button></div><div class="content-info"><h3>{{ item.title }}</h3><p>{{ item.meta }}</p></div></article>{% else %}<p>لا يوجد محتوى في هذا القسم حالياً.</p>{% endfor %}</div>
