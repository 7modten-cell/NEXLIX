<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#08080b">
  <meta name="description" content="NEXLIX — شاهد أكثر، وعش أكثر. مباريات مباشرة وتلفزيون وأفلام ومسلسلات.">
  <title>{% block title %}NEXLIX | شاهد أكثر · عش أكثر{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: { ink:'#08080b', panel:'#111116', redbrand:'#ed1724' }, fontFamily:{ sans:['Tahoma','Arial','sans-serif'] } } } }
  </script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
</head>
<body class="bg-ink text-white font-sans">
  {% block content %}{% endblock %}
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
